name: dbt jobs - plan (on PR)
run-name: dbt-jobs-as-code plan - podglad zmian jobow

# Na kazdym PR do main dotykajacym dbt_jobs/** pokazuje DIFF (co by sie zmienilo/usunelo).
# Nic nie aplikuje - tylko podglad do review.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt_jobs/**'

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.x"

      - name: Install dbt-jobs-as-code
        run: pip install "dbt-jobs-as-code~=1.20.0"

      - name: Plan
        run: dbt-jobs-as-code plan dbt_jobs/jobs.yml --vars-yml dbt_jobs/vars_prod.yml --limit-projects-envs-to-yml
        env:
          DBT_API_KEY: ${{ secrets.DBT_API_KEY }}
          DBT_BASE_URL: https://dx232.us1.dbt.com   # nowa platforma dbt (nie cloud.getdbt.com)
